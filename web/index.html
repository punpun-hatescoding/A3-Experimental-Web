<!DOCTYPE html>
<html lang="en">
  <head>
    <title>A3 Interactive Recruitment Poster</title>
    <link rel="stylesheet" href="https://use.typekit.net/avr8pxm.css" />
     <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css" />
    
    <meta charset="utf-8" />
  </head>
  <body>
    
    <div class="bg-poster">
      <div id="color"></div>
      <div id="bg-texture"></div>
      <div id="bg-ground"></div>
      <div id="bg-boots"></div>
    </div>

    <div class="title">
      <h3>We Need You.</h3>
      <h1>JOIN OUR ARMY NOW</h1>
      <h3>Together We Win</h3>
    </div>

    <div class="button-container">
      <button id="leave">Leave</button>
      <button onclick="window.location.href='getinfo.html'" id="join">Join</button>
    </div>

    <script src="join.js"></script>
  </body>
</html>
